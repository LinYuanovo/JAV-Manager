name: Build and Release Windows App

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'prompt/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.9'
        channel: 'stable'

    - name: Verify installations
      run: |
        python --version
        flutter --version

    - name: Get dependencies (Flutter)
      run: flutter pub get

    - name: Install Python dependencies
      run: |
        pip install -r python_scraper/requirements.txt
        pip install pyinstaller

    - name: Build Windows app (Flutter)
      run: flutter build windows --release

    - name: Build Python scraper (PyInstaller)
      run: pyinstaller python_scraper/scraper.spec --clean --noconfirm

    - name: Copy scraper to release directory
      shell: bash
      run: |
        cp dist/javsp_scraper.exe build/windows/x64/runner/Release/

    - name: Get version from pubspec.yaml
      id: get_version
      shell: bash
      run: |
        VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
        echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Create Release Archive
      shell: bash
      run: |
        cd build/windows/x64/runner/Release
        7z a -tzip "${GITHUB_WORKSPACE}/JAV-Manager-${{ steps.get_version.outputs.VERSION }}.zip" .

    - name: Verify archive exists
      shell: bash
      run: |
        ls -lh "${GITHUB_WORKSPACE}/JAV-Manager-${{ steps.get_version.outputs.VERSION }}.zip"
        echo "包含文件:"
        ls -lh build/windows/x64/runner/Release/*.exe build/windows/x64/runner/Release/*.dll | head -10

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: JAV-Manager v${{ steps.get_version.outputs.VERSION }}
        body: |
          ## JAV-Manager v${{ steps.get_version.outputs.VERSION }}

          ### 📦 下载说明
          - 下载 `JAV-Manager-${{ steps.get_version.outputs.VERSION }}.zip`
          - 解压到任意目录（保持目录结构完整）
          - 运行 `jav_manager.exe`

          ### ✨ 系统要求
          - Windows 10/11 (64位)
          - 首次运行可能需要几秒钟初始化

          ### ⚠️ 注意事项
          - 如遇杀毒软件误报，请添加信任或临时关闭防护

          ### ✨ 更新内容
          - 查看完整更新日志请访问 [CHANGELOG.md](https://github.com/LinYuanovo/JAV-Manager/blob/main/CHANGELOG.md)
        files: |
          ${{ github.workspace }}/JAV-Manager-${{ steps.get_version.outputs.VERSION }}.zip
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JAV-Manager-Windows-${{ steps.get_version.outputs.VERSION }}
        path: build/windows/x64/runner/Release/
        retention-days: 30
